name: eureka
description: Eureka (尤里卡) - AI学习强化训练应用
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  google_fonts: ^8.0.0
  path_provider: ^2.1.0
  flutter_secure_storage: ^10.0.0
  flutter_local_notifications: ^17.2.3
  share_plus: ^10.0.1
  file_picker: ^8.1.2
  timezone: ^0.9.4
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
